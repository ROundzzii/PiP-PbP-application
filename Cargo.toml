[package]
name = "pip-pbp"
version = "0.1.0"
edition = "2024"
description = "Picture-in-Picture / Picture-by-Picture entre deux PC Windows, faible latence"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
eframe = "0.37"
getrandom = "0.4"
hmac = "0.13"
if-addrs = "0.15"
openh264 = "0.9"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
toml = "1.1.8"
wgpu = "30"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi"] }
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# M??me en debug, les d??pendances (d??codage/encodage) sont optimis??es.
[profile.dev.package."*"]
opt-level = 3
